apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecr-credential
  namespace: thanos
  annotations:
    # Prometheus Operator CRD may not exist yet when ArgoCD dry-runs this resource
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: alerting-rules
    app.kubernetes.io/managed-by: Helm
    operator.thanos.io/prometheus-rule: "true"
spec:
  groups:
    - name: ecr-credential
      rules:
        # Fires when the ECR credential CronJob has not completed successfully
        # in over 4 hours (2 missed 2-hour cycles). HCP pods will begin failing
        # to pull images when the 12h ECR token expires.
        #
        # The metric originates from kube-state-metrics on each MC and is
        # remote-written to Thanos via the MC Prometheus (no filtering applied).
        # cluster_type="management-cluster" scopes to MCs only.
        #
        # The alert only fires on MCs where the CronJob exists (i.e. where
        # ecr.enabled = true). MCs without the controller produce no series
        # for this metric, so the expression returns no data rather than firing.
        - alert: ECRCredentialRefreshFailing
          expr: |
            (
              time()
              - kube_cronjob_status_last_successful_time{
                  cronjob="ecr-token-refresh",
                  namespace="ecr-credential-controller",
                  cluster_type="management-cluster"
                }
            ) > 4 * 3600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: ECR credential CronJob has not succeeded in >4h
            description: >-
              The ecr-token-refresh CronJob on management cluster
              {{ "{{" }} $labels.cluster {{ "}}" }} has not completed
              successfully in over 4 hours (2 missed cycles). HCP pods will
              begin failing to pull images once the 12h ECR authorization token
              expires. Check the CronJob logs in the
              ecr-credential-controller namespace.

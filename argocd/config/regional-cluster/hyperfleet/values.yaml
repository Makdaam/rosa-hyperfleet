hyperfleet:
  applicationName: hyperfleet-operator

  namespace: argocd

  targetNamespace: hyperfleet

  project: default

  source:
    repoURL: https://github.com/openshift-online/rosa-hyperfleet-api.git
    targetRevision: b4cd6727179f06048d3bbcca21aad34d1aad5925
    path: hyperfleet-operator/charts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  helmValues:
    image:
      repository: quay.io/redhat-user-workloads/rosa-tenant/hyperfleet-operator
      tag: "b4cd6727179f06048d3bbcca21aad34d1aad5925"
      pullPolicy: Always

    replicaCount: 2

    serviceAccount:
      create: true
      name: hyperfleet-operator
      annotations: {}

    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
